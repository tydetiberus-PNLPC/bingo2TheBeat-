<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Printable Bingo Booklets</title>
    <style>
        /* CSS PRINT ENGINE RULES */
        @page {
            size: letter portrait;
            margin: 0.25in;
        }
        
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #000000;
        }

        /* Hides the print button when actually printing */
        @media print {
            .no-print { display: none !important; }
            body { background: transparent; }
        }

        /* PAGE & CARD LAYOUT */
        .print-page {
            width: 8in;
            height: 10.5in;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            page-break-after: always;
            page-break-inside: avoid;
            box-sizing: border-box;
        }

        .bingo-card-wrapper {
            height: 48%; /* Takes up just under half the page */
            border: 2px dashed #cccccc; /* Cut line indicator */
            padding: 0.15in;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* CARD HEADER */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 10px;
            border-bottom: 3px solid #000;
            padding-bottom: 5px;
        }

        .header-left h1 { margin: 0; font-size: 16pt; font-weight: 900; text-transform: uppercase; }
        .header-left p { margin: 2px 0 0 0; font-size: 10pt; font-weight: bold; color: #444; }
        
        .header-right { text-align: right; }
        .header-right .game-badge { background: #000; color: #fff; padding: 4px 10px; font-weight: bold; font-size: 14pt; border-radius: 4px; display: inline-block;}
        .header-right .pack-id { font-size: 10pt; margin-top: 4px; font-weight: bold; }

        /* 5x5 BINGO GRID */
        .bingo-grid {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: 25px repeat(5, 1fr);
            gap: 2px;
            background: #000;
            border: 2px solid #000;
        }

        .col-header {
            background: #000;
            color: #fff;
            text-align: center;
            font-size: 14pt;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell {
            background: #fff;
            text-align: center;
            padding: 2px;
            font-size: 8.5pt;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            word-break: break-word;
        }

        .cell-free {
            background: #eeeeee;
            font-size: 12pt;
            font-weight: 900;
            text-transform: uppercase;
        }
        
        .card-footer {
            text-align: center;
            font-size: 8pt;
            margin-top: 5px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="no-print" style="background:#1976d2; color:white; padding:15px; text-align:center; font-family:sans-serif; margin-bottom: 20px;">
        <h2 style="margin:0 0 10px 0;">🖨️ Print Engine Ready</h2>
        <button onclick="window.print()" style="padding:10px 20px; font-size:16px; font-weight:bold; cursor:pointer;">Save as PDF / Print Booklet</button>
        <p style="margin:10px 0 0 0; font-size:14px;">Set layout to <strong>Portrait</strong>. Set margins to <strong>Minimum</strong> or <strong>None</strong>. Turn off headers/footers.</p>
    </div>

    <div id="print-container">
        <h3 style="text-align:center;">Generating Booklets...</h3>
    </div>

    <script>
        var currentEventId = "<?= eventId ?>" || "EVT_017046";

        document.addEventListener('DOMContentLoaded', function() {
            google.script.run
                .withSuccessHandler(renderBooklets)
                .getPrintableBookletData(currentEventId);
        });

        function renderBooklets(data) {
            const container = document.getElementById('print-container');
            container.innerHTML = '';

            const booklets = data.booklets;
            const themeName = data.themeName;

            // Loop through each physical booklet
            booklets.forEach(booklet => {
                const games = booklet.games;
                
                // Process 2 games per page
                for (let i = 0; i < games.length; i += 2) {
                    const game1 = games[i];
                    const game2 = games[i+1]; // Will exist because games are always even!

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'print-page';

                    pageDiv.appendChild(createCardElement(game1, booklet.bookletId, themeName));
                    if (game2) {
                        pageDiv.appendChild(createCardElement(game2, booklet.bookletId, themeName));
                    }

                    container.appendChild(pageDiv);
                }
            });
        }

        function createCardElement(gameData, bookletId, themeName) {
            const wrapper = document.createElement('div');
            wrapper.className = 'bingo-card-wrapper';

            let gridHTML = `
                <div class="col-header">B</div>
                <div class="col-header">I</div>
                <div class="col-header">N</div>
                <div class="col-header">G</div>
                <div class="col-header">O</div>
            `;

            gameData.songs.forEach((song, index) => {
                let cellClass = "cell";
                if (index === 12 || song === "FREE") cellClass += " cell-free";
                gridHTML += `<div class="${cellClass}">${song}</div>`;
            });

            wrapper.innerHTML = `
                <div class="card-header">
                    <div class="header-left">
                        <h1>Bingo to the Beat</h1>
                        <p>Theme: ${themeName}</p>
                    </div>
                    <div class="header-right">
                        <div class="game-badge">GAME #${gameData.gameNumber}</div>
                        <div class="pack-id">PACK ID: ${bookletId}</div>
                    </div>
                </div>
                <div class="bingo-grid">${gridHTML}</div>
                <div class="card-footer">Verification Code: ${bookletId}-${gameData.gameNumber} • Please play responsibly.</div>
            `;
            return wrapper;
        }
    </script>
</body>
</html>
