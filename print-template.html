<!DOCTYPE html>
<html>
<head>
    <style>
        @page { 
            size: letter landscape; 
            margin: 0.4in; 
        }
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            color: #000; 
            margin: 0; 
            padding: 0; 
            background: #fff; 
        }
        .page { 
            page-break-after: always; 
            width: 100%; 
            box-sizing: border-box; 
        }
        .page-header { 
            text-align: center; 
            font-size: 2.5rem; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            border-bottom: 4px solid #000; 
            padding-bottom: 5px; 
            margin-bottom: 15px; 
            color: #000; 
        }
        .card-container { 
            width: 100%; 
            text-align: center; 
        }
        .bingo-card { 
            display: inline-block; 
            width: 48%; 
            border: 3px solid #000; 
            padding: 15px; 
            box-sizing: border-box; 
            vertical-align: top; 
            margin: 0 0.5%; 
        }
        .card-header { 
            text-align: center; 
            margin-bottom: 10px; 
        }
        .card-header h2 { 
            margin: 0; 
            font-size: 1.4rem; 
            text-transform: uppercase; 
            font-weight: bold; 
        }
        .card-id { 
            margin: 5px 0 0 0; 
            font-size: 1.1rem; 
            font-weight: bold; 
            background: #000; 
            color: #fff; 
            display: inline-block; 
            padding: 4px 12px; 
            border-radius: 4px; 
        }
        .bingo-table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: fixed; 
            margin-top: 10px; 
        }
        .bingo-letter-header { 
            border: 2px solid #000; 
            font-size: 1.8rem; 
            font-weight: 900; 
            padding: 8px 0; 
            text-align: center; 
        }
        .bingo-cell { 
            border: 2px solid #000; 
            height: 75px; 
            text-align: center; 
            vertical-align: middle; 
            font-size: 11px; 
            font-weight: bold; 
            padding: 2px; 
            word-wrap: break-word; 
            overflow: hidden; 
        }
        .free-space-cell { 
            background-color: #eee; 
            font-size: 14px; 
            letter-spacing: 1px; 
            font-weight: 900; 
            border: 3px solid #000; 
        }
    </style>
</head>
<body>
    <!-- The CardService.gs injects the HTML payload here -->
    {{CARDS_PLACEHOLDER}}
</body>
</html>
